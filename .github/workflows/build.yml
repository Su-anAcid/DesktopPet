name: Build & Release

on:
  push:
    tags: ["v*"]          # 推送 v1.0.0 这类 tag 时自动构建并发布 Release
  workflow_dispatch:       # 也支持在 Actions 页面手动触发

jobs:
  macos:
    name: macOS (Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="dev"; fi
          ./release.sh "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktoppet-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            zip

      - name: Build & package
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/Windows"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="dev"; fi
          VERSION="$VERSION" ./build-win.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktoppet-windows
          path: Windows/build/*.zip

  release:
    name: Publish Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
