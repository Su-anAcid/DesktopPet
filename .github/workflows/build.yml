name: Build & Release

on:
  push:
    tags: ["v*"]          # 推送 v1.0.0 这类 tag 时自动构建并发布 Release
  workflow_dispatch:       # 也支持在 Actions 页面手动触发

jobs:
  macos:
    name: macOS (Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="dev"; fi
          ./release.sh "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktoppet-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            zip

      - name: Build & package
        shell: msys2 {0}
        run: |
          # 注意：脚本必须是 LF 换行（见 .gitattributes），CRLF 会让 bash 报 127
          set +e
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="dev"; fi
          export VERSION
          echo "VERSION=$VERSION  PWD=$(pwd)"
          command -v x86_64-w64-mingw32-g++ || echo "!! 找不到 g++"
          command -v x86_64-w64-mingw32-windres || echo "!! 找不到 windres"
          cd Windows || exit 1
          sed -i 's/\r$//' build-win.sh   # 万一 checkout 还是 CRLF，就地修掉
          bash -x ./build-win.sh > /tmp/winbuild.log 2>&1
          rc=$?
          tail -n 40 /tmp/winbuild.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::build-win.sh 退出码 $rc"
            tail -n 20 /tmp/winbuild.log | tr -d '\r' | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr '%' ' ')"
            done
          fi
          exit "$rc"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktoppet-windows
          path: Windows/build/*.zip

  release:
    name: Publish Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
