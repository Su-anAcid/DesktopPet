name: Build & Release

on:
  push:
    tags: ["v*"]          # 推送 v1.0.0 这类 tag 时自动构建并发布 Release
  workflow_dispatch:       # 也支持在 Actions 页面手动触发

jobs:
  macos:
    name: macOS (Universal)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build & package
        run: ./release.sh "${GITHUB_REF_NAME#v}"

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktoppet-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
