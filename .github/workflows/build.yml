name: Build & Release

on:
  push:
    tags: ["v*"]          # 推送 v1.0.0 这类 tag 时自动构建并发布 Release
  workflow_dispatch:       # 也支持在 Actions 页面手动触发

jobs:
  macos:
    name: macOS (Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="dev"; fi
          ./release.sh "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktoppet-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            zip

      - name: Ensure toolchain
        shell: msys2 {0}
        run: |
          set +e
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-binutils > /tmp/pkg.log 2>&1
          echo "pacman exit=$?"; tail -n 15 /tmp/pkg.log
          # 注解公开可读，方便没有日志权限时排查（notice 不会让 job 变红）
          echo "::notice::PKG> $(pacman -Q 2>/dev/null | grep -iE 'binutils|ucrt-x86_64-gcc' | tr '\n' ' ')"
          echo "::notice::RES> $(ls /ucrt64/bin/*windres* 2>/dev/null | tr '\n' ' ') $(command -v windres || echo no-windres)"

      - name: Build & package
        shell: msys2 {0}
        run: |
          # GitHub 只保留 10 条注解，所以失败时只把最有价值的几行报上来
          set +e
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="dev"; fi
          export VERSION
          cd Windows || exit 1
          sed -i 's/\r$//' build-win.sh   # 万一 checkout 还是 CRLF，就地修掉
          bash -x ./build-win.sh > /tmp/winbuild.log 2>&1
          rc=$?
          echo "===== 构建日志（末尾 40 行）====="
          tail -n 40 /tmp/winbuild.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::build-win.sh 退出码 $rc；MSYSTEM=$MSYSTEM；PWD=$(pwd)"
            echo "::error::g++=$(command -v x86_64-w64-mingw32-g++ || echo 缺失) windres=$(command -v x86_64-w64-mingw32-windres || echo 缺失)"
            echo "::error::assets=$(ls assets | tr '\n' ' ')"
            tail -n 5 /tmp/winbuild.log | tr -d '\r' | while IFS= read -r line; do
              echo "::error::LOG> $(printf '%s' "$line" | tr '%' ' ')"
            done
          fi
          exit "$rc"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktoppet-windows
          path: Windows/build/*.zip

  release:
    name: Publish Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 从 CHANGELOG 生成 Release 说明
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v v="## $VERSION" 'index($0, v)==1 {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md)
          if [ -z "$BODY" ]; then BODY="详见 CHANGELOG.md。"; fi
          {
            echo "body<<WB_EOF"
            echo "$BODY"
            echo ""
            echo "---"
            echo "**安装**：macOS 下载 dmg（首次打开需在「应用程序」里右键 → 打开）；Windows 下载 windows-x64.zip，解压后双击 exe 即可。"
            echo "WB_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
